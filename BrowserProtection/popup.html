<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* ============ WinUI 3 Fluent 设计令牌(明暗双主题) ============ */
  :root {
    --page-bg: #F3F3F3;                    /* SolidBackgroundFillColorBase */
    --layer-fill: #FFFFFF;                 /* LayerFillColorDefault: 卡片 */
    --layer-hover: rgba(0, 0, 0, 0.04);    /* LayerFillColorAlt */
    --text-primary: #1B1B1B;
    --text-secondary: #6E6E6E;
    --text-tertiary: #8D8D8D;
    --control-stroke: rgba(0, 0, 0, 0.058);
    --divider: rgba(0, 0, 0, 0.06);
    --critical: #C42B1C;                   /* SystemFillColorCritical */
    --success: #0F7B0F;                    /* SystemFillColorSuccess */
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #202020;
      --layer-fill: #2B2B2B;
      --layer-hover: rgba(255, 255, 255, 0.06);
      --text-primary: #FFFFFF;
      --text-secondary: #D0D0D0;
      --text-tertiary: #9C9C9C;
      --control-stroke: rgba(255, 255, 255, 0.08);
      --divider: rgba(255, 255, 255, 0.08);
      --critical: #FF99A4;
      --success: #6CCB5F;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.40), 0 8px 24px rgba(0, 0, 0, 0.50);
    }
  }
  @media (forced-colors: active) {
    :root {
      --page-bg: Canvas;
      --layer-fill: Canvas;
      --layer-hover: CanvasText;
      --text-primary: CanvasText;
      --text-secondary: CanvasText;
      --text-tertiary: CanvasText;
      --control-stroke: CanvasText;
      --divider: CanvasText;
      --critical: Mark;
      --success: CanvasText;
      --shadow: none;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 页面背景直接画在 body 上并圆角裁剪: 四角露出的窗口背景与页面色
     (#F3F3F3 浅 / #202020 深) 差异极小, 无可见直角; 内容层用白卡/深卡分层 */
  body {
    width: 320px;
    background: var(--page-bg);
    border-radius: 12px;
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ Header(品牌区, 页面色背景, 底部分隔线) ============ */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 16px 12px;
  }
  .header img {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .title {
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
  }
  .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* ============ 统计卡片(WinUI Card: LayerFill + 1px 描边 + 8px 圆角) ============ */
  .stats {
    display: flex;
    padding: 0 16px 16px;
    gap: 12px;
  }
  .stat-card {
    flex: 1;
    background: var(--layer-fill);
    border: 1px solid var(--control-stroke);
    border-radius: 8px;                    /* OverlayCornerRadius */
    padding: 12px 8px;
    text-align: center;
  }
  .stat-value {
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* ============ 列表标题(TextStyle Caption) ============ */
  .section-title {
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 4px 16px 8px;
  }

  /* ============ 最近拦截(ListView 风格) ============ */
  .recent {
    max-height: 176px;
    overflow-y: auto;
    padding: 0 16px 12px;
  }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 4px;                    /* ControlCornerRadius */
    font-size: 12px;
    word-break: break-all;
  }
  .recent-item:hover { background: var(--layer-hover); }
  .recent-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--critical);
    flex-shrink: 0;
  }
  .recent-item .url { flex: 1; color: var(--text-primary); }
  .recent-item .time { color: var(--text-tertiary); font-size: 11px; flex-shrink: 0; }
  .empty {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    padding: 20px 0;
  }

  /* ============ Footer ============ */
  .footer {
    padding: 10px 16px;
    border-top: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .footer .enabled { color: var(--success); font-weight: 600; }
</style>
</head>
<body>
  <div class="header">
      <img src="icons/icon48.png" alt="Xdows Security">
      <div>
        <div class="title" data-i18n="extName">Xdows Security 网络防护</div>
        <div class="subtitle" data-i18n="popupSubtitle">银狐病毒钓鱼网站拦截</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label" data-i18n="statBlocked">已拦截</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="ruleCount">-</div>
        <div class="stat-label" data-i18n="statRules">防护规则</div>
      </div>
    </div>

    <div class="section-title" data-i18n="recentTitle">最近拦截</div>
    <div class="recent" id="recentList">
      <div class="empty" data-i18n="noRecent">暂无拦截记录</div>
    </div>

    <div class="footer">
      <span><span data-i18n="statusLabel">状态</span>: <span class="enabled" data-i18n="statusProtecting">防护中</span></span>
      <span>Xdows Security</span>
    </div>

  <script src="popup.js"></script>
</body>
</html>
